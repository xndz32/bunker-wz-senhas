<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Intel Verdansk // Sistema de Cofres</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0a0e14;
    --card: #1a1f2e;
    --accent: #00ff9d;
    --yellow: #ffcc00;
    --red: #ff375f;
    --text: #e4f0ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Share Tech Mono', monospace;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--bg);
}

/* FUNDO COM IMAGEM BORRADA */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("bg-warzone.jpg");
    background-size: cover;
    background-position: center;
    filter: blur(4px);  /* blur só no fundo */
    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 20, 0.65);
    z-index: -1;
}

header {
    padding: 1.5rem;
    text-align: center;
    border-bottom: 2px solid var(--accent);
    background: rgba(10, 14, 20, 0.9);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 1;
}
h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--yellow));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.controls {
    padding: 1.5rem;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 1;
}
.search-box {
    position: relative;
    width: min(90%, 400px);
}
.search-box input {
    width: 100%;
    padding: 12px 20px 12px 45px;
    background: rgba(26, 31, 46, 0.8);
    border: 1px solid rgba(0, 255, 157, 0.3);
    border-radius: 4px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    transition: all 0.3s;
}
.search-box input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
}
.search-box::before {
    content: '🔍';
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.7;
}
.carousel-container {
    padding: 1rem 0 3rem;
    position: relative;
    z-index: 1;
}
.carousel {
    display: flex;
    gap: 1.5rem;
    padding: 1rem 2rem;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }
.card {
    min-width: 280px;
    background: linear-gradient(145deg, var(--card), #151a26);
    border: 1px solid rgba(0, 255, 157, 0.1);
    border-radius: 8px;
    padding: 1.5rem;
    position: relative;
    flex-shrink: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}
.card:hover {
    transform: translateY(-8px);
    border-color: var(--accent);
    box-shadow: 0 15px 30px rgba(0, 255, 157, 0.15);
}
.card.puzzle { border-top: 4px solid var(--red); }
.card.standard { border-top: 4px solid var(--accent); }
.card h3 {
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    color: var(--accent);
}
.card.puzzle h3 { color: var(--red); }
.location {
    display: block;
    color: #8a9ba8;
    font-size: 0.9rem;
    margin-bottom: 1rem;
}
.code {
    background: rgba(0, 0, 0, 0.5);
    padding: 1rem;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    text-align: center;
    letter-spacing: 4px;
    color: var(--yellow);
    border-radius: 4px;
    margin: 1rem 0;
    border: 1px dashed rgba(255, 204, 0, 0.3);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
}
.code:hover { background: rgba(0, 0, 0, 0.7); }
.copy-btn {
    width: 100%;
    padding: 12px;
    background: rgba(0, 255, 157, 0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}
.copy-btn:hover {
    background: var(--accent);
    color: #000;
}
.coord {
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-size: 0.8rem;
    color: #5d7290;
    background: rgba(255,255,255,0.05);
    padding: 4px 8px;
    border-radius: 3px;
}
.scroll-hint {
    text-align: center;
    color: #5d7290;
    font-size: 0.8rem;
    margin-top: 1rem;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}
footer {
    margin-top: auto;
    padding: 2rem;
    text-align: center;
    background: rgba(10, 14, 20, 0.8);
    border-top: 1px solid rgba(0, 255, 157, 0.1);
    position: relative;
    z-index: 1;
}
.dev {
    color: var(--accent);
    font-weight: bold;
    font-size: 1.1rem;
    margin-top: 0.5rem;
}
.dev a {
    color: var(--accent);
    text-decoration: none;
}
.dev a:hover {
    color: var(--yellow);
}
.toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: #000;
    padding: 1rem 2rem;
    border-radius: 4px;
    font-weight: bold;
    z-index: 1000;
    transition: transform 0.3s;
    box-shadow: 0 5px 15px rgba(0,255,157,0.3);
}
.toast.show {
    transform: translateX(-50%) translateY(0);
}
@media (max-width: 768px) {
    .carousel { padding: 1rem; }
    .card { min-width: 260px; }
    .code { font-size: 1.5rem; }
}
</style>
</head>
<body>

<header>
    <h1>VERDANSK VAULT SYSTEM</h1>
</header>

<div class="controls">
    <div class="search-box">
        <input type="text" id="search" placeholder="Buscar cofre ou localização...">
    </div>
</div>

<div class="carousel-container">
    <div class="carousel" id="carousel"></div>
    <div class="scroll-hint">← Arraste para explorar →</div>
</div>

<footer>
    <div style="color: #5d7290; margin-bottom: 0.5rem;">SISTEMA TÁTICO DE INTELIGÊNCIA</div>
    <div class="dev">
        ENZO PESSATTO <br>
        <a href="https://youtube.com/@xndz_wz?si=uYwPTEANSxmwacGO" target="_blank">
            Clique aqui para ir para meu canal
        </a>
    </div>
</footer>

<div class="toast" id="toast">Código copiado!</div>

<script>
const safes = [
    { name: "Prisão (Shack)", type: "standard", location: "Noroeste da Prisão", code: "72948531", coord: "H8" },
    { name: "Farmland", type: "standard", location: "Celeiro Principal", code: "49285163", coord: "H6" },
    { name: "Bunker 0", type: "standard", location: "Sul do Junkyard", code: "87624851", coord: "D8" },
    { name: "Bunker 1", type: "standard", location: "Entrada do Bunker 1", code: "12345678", coord: "E5" },
    { name: "Bunker 2", type: "standard", location: "Entrada do Bunker 2", code: "23456789", coord: "D6" },
    { name: "Bunker 3", type: "standard", location: "Entrada do Bunker 3", code: "34567890", coord: "C7" },
    { name: "Bunker 4", type: "standard", location: "Norte do Junkyard", code: "97264138", coord: "B5" },
    { name: "Bunker 5", type: "standard", location: "Entrada do Bunker 5", code: "45678901", coord: "A6" },
    { name: "Bunker 6", type: "standard", location: "Entrada do Bunker 6", code: "56789012", coord: "B7" },
    { name: "Bunker 7", type: "standard", location: "Entrada do Bunker 7", code: "67890123", coord: "C8" },
    { name: "Bunker 8", type: "standard", location: "Entrada do Bunker 8", code: "78901234", coord: "D9" },
    { name: "Bunker 9", type: "standard", location: "Entrada do Bunker 9", code: "89012345", coord: "E9" },
    { name: "Bunker 10", type: "standard", location: "Sul do Park", code: "60274513", coord: "F8" },
    { name: "Bunker 11", type: "puzzle", location: "Base Militar Norte", code: "PUZZLE", coord: "A0" },
    { name: "Estádio", type: "puzzle", location: "Nível Executivo", code: "CARTÃO AZUL", coord: "G5" }
];

const carousel = document.getElementById('carousel');
const search = document.getElementById('search');
const toast = document.getElementById('toast');

function renderCards(filter = '') {
    carousel.innerHTML = '';
    const term = filter.toLowerCase();
    
    safes.forEach(safe => {
        if (!term || 
            safe.name.toLowerCase().includes(term) || 
            safe.location.toLowerCase().includes(term) ||
            safe.coord.toLowerCase().includes(term)) {
            
            const card = document.createElement('div');
            card.className = `card ${safe.type}`;
            card.innerHTML = `
                <div class="coord">${safe.coord}</div>
                <h3>${safe.name}</h3>
                <span class="location">📍 ${safe.location}</span>
                <div class="code" onclick="copyCode('${safe.code}')">${safe.code}</div>
                <button class="copy-btn" onclick="copyCode('${safe.code}')">
                    ${/^\d+$/.test(safe.code) ? 'Copiar Código' : 'Sistema Especial'}
                </button>
            `;
            carousel.appendChild(card);
        }
    });
}

function copyCode(code) {
    if (isNaN(code)) return;
    navigator.clipboard.writeText(code);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

search.addEventListener('input', (e) => renderCards(e.target.value));

let isDragging = false, startX, scrollLeft;
carousel.addEventListener('mousedown', (e) => {
    isDragging = true;
    startX = e.pageX - carousel.offsetLeft;
    scrollLeft = carousel.scrollLeft;
});
carousel.addEventListener('mouseleave', () => isDragging = false);
carousel.addEventListener('mouseup', () => isDragging = false);
carousel.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const x = e.pageX - carousel.offsetLeft;
    const walk = (x - startX) * 1.5;
    carousel.scrollLeft = scrollLeft - walk;
});

carousel.addEventListener('touchstart', (e) => {
    startX = e.touches[0].pageX - carousel.offsetLeft;
    scrollLeft = carousel.scrollLeft;
});
carousel.addEventListener('touchmove', (e) => {
    if (!startX) return;
    const x = e.touches[0].pageX - carousel.offsetLeft;
    const walk = (x - startX) * 1.5;
    carousel.scrollLeft = scrollLeft - walk;
});

renderCards();
</script>

</body>
</html>
